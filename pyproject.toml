[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-config-gen"
version = "0.2.0"
description = "Declarative Nginx and Caddy reverse proxy configuration generator from YAML specs"
authors = [{ name = "txltedxgod", email = "seidoutakidzava@gmail.com" }]
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.6.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
]
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
nginx-gen = "nginx_gen.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
